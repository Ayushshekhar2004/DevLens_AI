services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1/}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      OLLAMA_PROFILES: ${OLLAMA_PROFILES:-local|This machine|http://host.docker.internal:11434}
      OLLAMA_DEFAULT_PROFILE: ${OLLAMA_DEFAULT_PROFILE:-local}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-5}
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-120}
      OLLAMA_OUTPUT_LIMIT: ${OLLAMA_OUTPUT_LIMIT:-2048}
      OLLAMA_CONTEXT_BUDGET: ${OLLAMA_CONTEXT_BUDGET:-8192}
      REPOSITORY_STORAGE_ROOT: /app/data/repository-snapshots
      REPOSITORY_ALLOWED_FOLDER_ROOT: ${REPOSITORY_ALLOWED_FOLDER_ROOT:-/app/import-root}
      REPOSITORY_MAX_UPLOAD_BYTES: ${REPOSITORY_MAX_UPLOAD_BYTES:-10485760}
      REPOSITORY_MAX_EXPANDED_BYTES: ${REPOSITORY_MAX_EXPANDED_BYTES:-52428800}
      REPOSITORY_MAX_FILE_BYTES: ${REPOSITORY_MAX_FILE_BYTES:-1048576}
      REPOSITORY_MAX_FILES: ${REPOSITORY_MAX_FILES:-2000}
      REPOSITORY_MAX_PATH_DEPTH: ${REPOSITORY_MAX_PATH_DEPTH:-20}
      REPOSITORY_MAX_DECOMPRESSION_RATIO: ${REPOSITORY_MAX_DECOMPRESSION_RATIO:-100}
      REPOSITORY_MAX_ELAPSED_SECONDS: ${REPOSITORY_MAX_ELAPSED_SECONDS:-30}
      REPOSITORY_IMPORT_CLI_ENABLED: ${REPOSITORY_IMPORT_CLI_ENABLED:-false}
      REPOSITORY_IMPORT_CLI_SOURCE: ${REPOSITORY_IMPORT_CLI_SOURCE:-}
      REPOSITORY_IMPORT_CLI_OWNER_EMAIL: ${REPOSITORY_IMPORT_CLI_OWNER_EMAIL:-}
      REPOSITORY_SCAN_MAX_TEXT_BYTES: ${REPOSITORY_SCAN_MAX_TEXT_BYTES:-1048576}
      REPOSITORY_SCAN_MAX_MANIFEST_BYTES: ${REPOSITORY_SCAN_MAX_MANIFEST_BYTES:-262144}
      REPOSITORY_SCAN_MAX_SYMBOLS_PER_FILE: ${REPOSITORY_SCAN_MAX_SYMBOLS_PER_FILE:-1000}
      REPOSITORY_SCAN_MAX_IMPORTS_PER_FILE: ${REPOSITORY_SCAN_MAX_IMPORTS_PER_FILE:-1000}
      REPOSITORY_WORKER_COUNT: ${REPOSITORY_WORKER_COUNT:-2}
      REPOSITORY_QUEUE_CAPACITY: ${REPOSITORY_QUEUE_CAPACITY:-20}
      REPOSITORY_RETENTION_DAYS: ${REPOSITORY_RETENTION_DAYS:-0}
      REPOSITORY_CLEANUP_INTERVAL_HOURS: ${REPOSITORY_CLEANUP_INTERVAL_HOURS:-24}
    volumes:
      - repository_data:/app/data/repository-snapshots
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  repository_data:
