spring.application.name=DevLens AI Backend

server.port=${SERVER_PORT:8080}

# Browser origin allowed to call the API during local frontend development.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Local PostgreSQL settings. Override these values with environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devlens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the local schema aligned with the persistence model during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# AI provider settings. "auto" selects the real provider only when a key is present.
app.ai.provider=${AI_PROVIDER:auto}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1/}
app.ai.model=${AI_MODEL:gpt-4.1-mini}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
