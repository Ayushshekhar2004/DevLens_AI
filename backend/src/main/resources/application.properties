spring.application.name=DevLens AI Backend

server.port=${SERVER_PORT:8080}

# Browser origin allowed to call the API during local frontend development.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Local PostgreSQL settings. Override these values with environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devlens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the local schema aligned with the persistence model during development.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

# AI provider settings. "auto" selects the real provider only when a key is present.
app.ai.provider=${AI_PROVIDER:auto}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1/}
app.ai.model=${AI_MODEL:gpt-4.1-mini}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# Ollama is opt-in. Profiles are administrator-configured ID|label|trusted URL entries.
app.ollama.profiles=${OLLAMA_PROFILES:local|This machine|http://localhost:11434}
app.ollama.default-profile=${OLLAMA_DEFAULT_PROFILE:local}
app.ollama.model=${OLLAMA_MODEL:}
app.ollama.connect-timeout-seconds=${OLLAMA_CONNECT_TIMEOUT_SECONDS:5}
app.ollama.read-timeout-seconds=${OLLAMA_READ_TIMEOUT_SECONDS:120}
app.ollama.output-limit=${OLLAMA_OUTPUT_LIMIT:2048}
app.ollama.context-budget=${OLLAMA_CONTEXT_BUDGET:8192}

# Authentication secrets must be supplied by the environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Prevent framework validation diagnostics from writing rejected password values.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO

# Private, bounded repository snapshots. Folder import is disabled unless explicitly enabled by an administrator.
app.repository-import.storage-root=${REPOSITORY_STORAGE_ROOT:./data/private/repository-snapshots}
app.repository-import.allowed-folder-root=${REPOSITORY_ALLOWED_FOLDER_ROOT:./data/import-root}
app.repository-import.max-upload-bytes=${REPOSITORY_MAX_UPLOAD_BYTES:10485760}
app.repository-import.max-expanded-bytes=${REPOSITORY_MAX_EXPANDED_BYTES:52428800}
app.repository-import.max-file-bytes=${REPOSITORY_MAX_FILE_BYTES:1048576}
app.repository-import.max-files=${REPOSITORY_MAX_FILES:2000}
app.repository-import.max-path-depth=${REPOSITORY_MAX_PATH_DEPTH:20}
app.repository-import.max-decompression-ratio=${REPOSITORY_MAX_DECOMPRESSION_RATIO:100}
app.repository-import.max-elapsed-seconds=${REPOSITORY_MAX_ELAPSED_SECONDS:30}
app.repository-import.cli.enabled=${REPOSITORY_IMPORT_CLI_ENABLED:false}
app.repository-import.cli.source=${REPOSITORY_IMPORT_CLI_SOURCE:}
app.repository-import.cli.owner-email=${REPOSITORY_IMPORT_CLI_OWNER_EMAIL:}
spring.servlet.multipart.max-file-size=${REPOSITORY_MAX_UPLOAD_BYTES:10485760}
spring.servlet.multipart.max-request-size=${REPOSITORY_MAX_UPLOAD_BYTES:10485760}

# Deterministic repository scanner bounds.
app.repository-scan.max-text-bytes=${REPOSITORY_SCAN_MAX_TEXT_BYTES:1048576}
app.repository-scan.max-manifest-bytes=${REPOSITORY_SCAN_MAX_MANIFEST_BYTES:262144}
app.repository-scan.max-symbols-per-file=${REPOSITORY_SCAN_MAX_SYMBOLS_PER_FILE:1000}
app.repository-scan.max-imports-per-file=${REPOSITORY_SCAN_MAX_IMPORTS_PER_FILE:1000}

# Durable lifecycle state with bounded in-process scan execution. Zero retention days disables automatic deletion.
app.repository-lifecycle.worker-count=${REPOSITORY_WORKER_COUNT:2}
app.repository-lifecycle.queue-capacity=${REPOSITORY_QUEUE_CAPACITY:20}
app.repository-lifecycle.retention-days=${REPOSITORY_RETENTION_DAYS:0}
app.repository-lifecycle.cleanup-interval-hours=${REPOSITORY_CLEANUP_INTERVAL_HOURS:24}
