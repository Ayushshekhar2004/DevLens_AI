spring.application.name=DevLens AI Backend

server.port=${SERVER_PORT:8080}

# Browser origin allowed to call the API during local frontend development.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Local PostgreSQL settings. Override these values with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devlens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema management will be introduced when entities are added.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
